<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todoタスクアプリ</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="Todo-main">
        <header class="Todo-header">
        <h1 class="Todo-header-title">Todoタスクアプリ</h1>
        </header>
        
        <form th:action="@{/add}" method
        ="post"><input type="text" name="text" placeholder="新しいタスクを入力してください" class="Todo-add-input"><button class="Todo-add-btn" type="submit">追加</button></form>

        <form th:action="@{/delete}" method="post"><button class="Todo-delete-btn">削除</button></form>
    </div>
</body>
</html>
