name: Deploy Python Lambda to LocalStack

on:
  push:
    branches: [ feature ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build Deployment Package
        run: |
          mkdir -p package
          cp -r lambda_function/. package/
          echo "Current package structure:"
          ls -R package
          cd package && zip -r ../function.zip .

      - name: Deploy to LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-1
        run: |
          awslocal s3 mb s3://s3-test-bucket || true
          awslocal s3 cp function.zip s3://s3-test-bucket/function.zip
          awslocal lambda create-function \
            --function-name lambda-function \
            --runtime python3.9 \
            --role arn:aws:iam::000000000000:role/lambda-role \
            --handler app.lambda_handler \
            --code S3Bucket=s3-test-bucket,S3Key=function.zip
          echo "Waiting for function to become Active..."
          awslocal lambda wait function-active-v2 --function-name lambda-function
          echo "Deployment successful!"
